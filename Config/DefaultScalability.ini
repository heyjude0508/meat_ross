; Lower "High/Epic" cost for indoor VR scenes (many local lights).

[ShadowQuality@2]
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.RadiusThreshold=0.04
r.Shadow.DistanceScale=0.85

[ShadowQuality@3]
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.RadiusThreshold=0.03
r.Shadow.DistanceScale=1.0

[GlobalIlluminationQuality@2]
r.LumenScene.DirectLighting.UpdateFactor=16
r.LumenScene.Radiosity.UpdateFactor=32

[GlobalIlluminationQuality@3]
r.LumenScene.DirectLighting.UpdateFactor=16
r.LumenScene.Radiosity.UpdateFactor=32

[ReflectionQuality@2]
r.SSR.Quality=2
r.Lumen.Reflections.DownsampleFactor=2

[ReflectionQuality@3]
r.SSR.Quality=2
r.Lumen.Reflections.DownsampleFactor=2

[PostProcessQuality@2]
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=1
r.BloomQuality=2
r.DepthOfFieldQuality=0
r.LensFlareQuality=0

[PostProcessQuality@3]
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=1
r.BloomQuality=2
r.DepthOfFieldQuality=0
r.LensFlareQuality=0

[EffectsQuality@2]
r.TranslucencyLightingVolumeDim=32
r.RefractionQuality=1

[EffectsQuality@3]
r.TranslucencyLightingVolumeDim=32
r.RefractionQuality=1
